<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>globale.tv</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #031029;
            font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Tam Ekran & 16:9 TV Uyumlu Açılış Sahnesi */
        .tv-splash-root {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle at 50% 46%, #05183f 0%, #031029 58%, #020b1f 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* Arka Plan Yumuşak Ortam Işığı */
        .ambient-glow {
            position: absolute;
            width: min(46vw, 82vh);
            height: min(46vw, 82vh);
            border-radius: 50%;
            background: radial-gradient(circle, rgba(24, 144, 255, 0.24) 0%, rgba(10, 75, 180, 0.08) 48%, transparent 72%);
            filter: blur(44px);
            pointer-events: none;
            opacity: 0;
            transform: scale(0.75);
            animation: glowFadeIn 3.2s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }

        /* Merkez Logo Konteyneri */
        .splash-stage {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            perspective: 1400px;
        }

        /* 3D Eğimli Yuvarlatılmış Trapezoid Cam Çerçeve */
        .logo-frame-wrap {
            position: relative;
            width: min(22vw, 39vh);
            height: min(20vw, 35.5vh);
            min-width: 170px;
            min-height: 154px;
            display: flex;
            align-items: center;
            justify-content: center;
            transform-style: preserve-3d;
            opacity: 0;
            transform: scale(0.84) rotateY(-12deg) rotateX(6deg) translateY(14px);
            filter: drop-shadow(0 28px 54px rgba(0, 5, 18, 0.78));
            animation:
                frameEntrance 1.35s cubic-bezier(0.16, 1, 0.3, 1) 0.1s forwards,
                gentleFloat 6.5s ease-in-out 1.6s infinite;
        }

        .logo-svg {
            width: 100%;
            height: 100%;
            overflow: visible;
        }

        /* Sağ-Alt Mavi Cam Dalgası Yükselişi */
        .wave-fill-group {
            transform-origin: 50% 100%;
            opacity: 0;
            transform: translateY(28px) scaleY(0.75);
            animation: waveRise 1.35s cubic-bezier(0.22, 1, 0.36, 1) 0.32s forwards;
        }

        /* Merkez Play Üçgeni ve Şok Dalgası */
        .play-icon-group {
            transform-origin: 188px 164px;
            opacity: 0;
            transform: scale(0.45);
            animation: playPopIn 0.95s cubic-bezier(0.34, 1.48, 0.64, 1) 0.56s forwards;
        }

        .play-ripple {
            transform-origin: 188px 164px;
            opacity: 0;
            transform: scale(0.7);
            animation: rippleExpand 1.35s cubic-bezier(0.16, 1, 0.3, 1) 0.62s forwards;
        }

        /* Cam Yüzeyinden Süpüren Işık Yansıması */
        .glass-glint {
            opacity: 0;
            transform: translateX(-260px);
            animation: glassSweep 1.35s cubic-bezier(0.25, 1, 0.5, 1) 0.72s forwards;
        }

        /* Tipografi: globale.tv */
        .brand-title {
            margin-top: min(1.3vw, 2.3vh);
            display: flex;
            align-items: baseline;
            justify-content: center;
            font-size: clamp(2.1rem, min(5.2vw, 9.2vh), 6.2rem);
            font-weight: 700;
            line-height: 1;
            letter-spacing: -0.032em;
            color: #ffffff;
            text-shadow: 0 10px 30px rgba(0, 6, 22, 0.65);
        }

        .letter {
            display: inline-block;
            opacity: 0;
            transform: translateY(18px) scale(0.94);
            filter: blur(5px);
            animation: letterAppear 0.78s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            animation-delay: calc(0.86s + (var(--i) * 0.04s));
        }

        .letter-dot {
            color: #ffffff;
            animation:
                letterAppear 0.78s cubic-bezier(0.16, 1, 0.3, 1) calc(0.86s + (var(--i) * 0.04s)) forwards,
                dotCyanPulse 1.35s ease-out 1.3s forwards;
        }

        /* ================= KEYFRAMES ================= */
        @keyframes glowFadeIn {
            0% {
                opacity: 0;
                transform: scale(0.75);
            }
            45% {
                opacity: 1;
                transform: scale(1.04);
            }
            100% {
                opacity: 0.88;
                transform: scale(1);
            }
        }

        @keyframes frameEntrance {
            0% {
                opacity: 0;
                transform: scale(0.84) rotateY(-12deg) rotateX(6deg) translateY(14px);
            }
            100% {
                opacity: 1;
                transform: scale(1) rotateY(0deg) rotateX(0deg) translateY(0px);
            }
        }

        @keyframes gentleFloat {
            0%, 100% {
                transform: translateY(0px);
            }
            50% {
                transform: translateY(-4px);
            }
        }

        @keyframes waveRise {
            0% {
                opacity: 0;
                transform: translateY(28px) scaleY(0.75);
            }
            100% {
                opacity: 1;
                transform: translateY(0px) scaleY(1);
            }
        }

        @keyframes playPopIn {
            0% {
                opacity: 0;
                transform: scale(0.45);
            }
            70% {
                opacity: 1;
                transform: scale(1.05);
            }
            100% {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes rippleExpand {
            0% {
                opacity: 0;
                transform: scale(0.75);
            }
            25% {
                opacity: 0.55;
            }
            100% {
                opacity: 0;
                transform: scale(1.65);
            }
        }

        @keyframes glassSweep {
            0% {
                opacity: 0;
                transform: translateX(-260px);
            }
            25% {
                opacity: 0.65;
            }
            75% {
                opacity: 0.65;
            }
            100% {
                opacity: 0;
                transform: translateX(340px);
            }
        }

        @keyframes letterAppear {
            0% {
                opacity: 0;
                transform: translateY(18px) scale(0.94);
                filter: blur(5px);
            }
            100% {
                opacity: 1;
                transform: translateY(0px) scale(1);
                filter: blur(0px);
            }
        }

        @keyframes dotCyanPulse {
            0% {
                color: #ffffff;
                text-shadow: 0 0 0 rgba(56, 189, 248, 0);
            }
            35% {
                color: #5ce1ff;
                text-shadow: 0 0 22px rgba(56, 189, 248, 0.95), 0 0 42px rgba(14, 165, 233, 0.7);
            }
            100% {
                color: #ffffff;
                text-shadow: 0 10px 30px rgba(0, 6, 22, 0.65);
            }
        }
    </style>
</head>
<body>

    <main class="tv-splash-root" aria-label="globale.tv Açılış Ekranı">
        <div class="splash-stage">
            <!-- Arka Plan Yumuşak Parıltı -->
            <div class="ambient-glow"></div>

            <!-- 3D Cam Çerçeve & Oynat Simgesi -->
            <div class="logo-frame-wrap">
                <svg class="logo-svg" viewBox="0 0 380 340" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <!-- Dış Çerçeve Formu (Sağa Yukarı Hafif Eğimli Yuvarlatılmış Trapezoid) -->
                        <path id="outer-tv-shape" d="
                            M 64 114
                            C 64 78, 86 58, 122 50
                            L 266 18
                            C 306 9, 332 30, 332 70
                            L 332 246
                            C 332 284, 308 306, 270 304
                            L 118 294
                            C 84 291, 64 268, 64 234
                            Z
                        " />

                        <!-- İç Ekran Cam Oyuğu -->
                        <path id="inner-tv-shape" d="
                            M 86 128
                            C 86 100, 104 84, 132 78
                            L 264 49
                            C 296 42, 316 58, 316 90
                            L 316 238
                            C 316 268, 296 286, 266 284
                            L 130 275
                            C 102 273, 86 254, 86 226
                            Z
                        " />

                        <clipPath id="clip-outer">
                            <use href="#outer-tv-shape" />
                        </clipPath>

                        <clipPath id="clip-inner">
                            <use href="#inner-tv-shape" />
                        </clipPath>

                        <!-- Cam Gövde Gradyanı -->
                        <linearGradient id="glass-body-grad" x1="64" y1="30" x2="332" y2="300" gradientUnits="userSpaceOnUse">
                            <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22" />
                            <stop offset="35%" stop-color="#7dd3fc" stop-opacity="0.09" />
                            <stop offset="75%" stop-color="#0284c7" stop-opacity="0.14" />
                            <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.32" />
                        </linearGradient>

                        <!-- Sol-Üst Kalın Beyaz/Gümüş Cam Kenar Parlaması -->
                        <linearGradient id="top-left-rim-grad" x1="64" y1="45" x2="315" y2="120" gradientUnits="userSpaceOnUse">
                            <stop offset="0%" stop-color="#ffffff" stop-opacity="0.96" />
                            <stop offset="45%" stop-color="#e0f2fe" stop-opacity="0.88" />
                            <stop offset="85%" stop-color="#bae6fd" stop-opacity="0.55" />
                            <stop offset="100%" stop-color="#7dd3fc" stop-opacity="0.15" />
                        </linearGradient>

                        <!-- Dış Kontur Işık Kenarı -->
                        <linearGradient id="stroke-rim-grad" x1="64" y1="40" x2="332" y2="305" gradientUnits="userSpaceOnUse">
                            <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
                            <stop offset="45%" stop-color="#bae6fd" stop-opacity="0.45" />
                            <stop offset="80%" stop-color="#38bdf8" stop-opacity="0.55" />
                            <stop offset="100%" stop-color="#7dd3fc" stop-opacity="0.95" />
                        </linearGradient>

                        <!-- Alt-Sağ Mavi Dalga Gradyanı -->
                        <linearGradient id="cyan-wave-grad" x1="120" y1="295" x2="332" y2="195" gradientUnits="userSpaceOnUse">
                            <stop offset="0%" stop-color="#0077ff" stop-opacity="0.72" />
                            <stop offset="50%" stop-color="#0ea5e9" stop-opacity="0.88" />
                            <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.96" />
                        </linearGradient>

                        <!-- Dalga Üst Sırt Işığı -->
                        <linearGradient id="wave-crest-grad" x1="115" y1="286" x2="328" y2="196" gradientUnits="userSpaceOnUse">
                            <stop offset="0%" stop-color="#7dd3fc" stop-opacity="0.25" />
                            <stop offset="55%" stop-color="#bae6fd" stop-opacity="0.85" />
                            <stop offset="100%" stop-color="#ffffff" stop-opacity="0.95" />
                        </linearGradient>

                        <!-- Play Üçgeni Gradyanı -->
                        <linearGradient id="play-tri-grad" x1="154" y1="115" x2="238" y2="208" gradientUnits="userSpaceOnUse">
                            <stop offset="0%" stop-color="#ffffff" />
                            <stop offset="28%" stop-color="#bae6fd" />
                            <stop offset="72%" stop-color="#29b6f6" />
                            <stop offset="100%" stop-color="#0284c7" />
                        </linearGradient>

                        <!-- Süpüren Cam Işık Yansıması -->
                        <linearGradient id="glint-sweep-grad" x1="0" y1="0" x2="1" y2="0.25">
                            <stop offset="0%" stop-color="#ffffff" stop-opacity="0" />
                            <stop offset="50%" stop-color="#ffffff" stop-opacity="0.48" />
                            <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
                        </linearGradient>

                        <!-- Play İkonu Yumuşak Parıltı -->
                        <filter id="play-soft-glow" x="-30%" y="-30%" width="160%" height="160%">
                            <feGaussianBlur stdDeviation="7" result="blur" />
                            <feMerge>
                                <feMergeNode in="blur" />
                                <feMergeNode in="SourceGraphic" />
                            </feMerge>
                        </filter>
                    </defs>

                    <!-- 1. Ana Yarı Saydam Cam Gövde -->
                    <use href="#outer-tv-shape" fill="url(#glass-body-grad)" />

                    <!-- 2. Sol ve Üst Kalın Cam Kenar Vurgusu -->
                    <g clip-path="url(#clip-outer)">
                        <path d="
                            M 60 250
                            L 60 110
                            C 60 72, 84 52, 122 44
                            L 270 12
                            C 305 5, 330 22, 332 58
                            C 324 38, 304 34, 272 41
                            L 132 72
                            C 100 79, 82 98, 82 130
                            L 82 242
                            C 82 264, 92 278, 108 286
                            C 78 282, 60 268, 60 250
                            Z
                        " fill="url(#top-left-rim-grad)" />

                        <!-- Sağ Kenar İnce Cam Yansıması -->
                        <path d="
                            M 318 65
                            L 318 245
                            C 318 274, 300 292, 272 294
                            L 334 298
                            L 334 65
                            Z
                        " fill="#38bdf8" opacity="0.24" />
                    </g>

                    <!-- 3. İç Karanlık Cam Derinliği ve Alt-Sağ Mavi Dalga -->
                    <g clip-path="url(#clip-inner)">
                        <rect x="70" y="30" width="265" height="275" fill="#031029" opacity="0.54" />

                        <!-- Yükselen Mavi Işık Dalgası -->
                        <g class="wave-fill-group">
                            <path d="
                                M 108 282
                                C 175 256, 268 228, 322 192
                                L 322 292
                                L 108 292
                                Z
                            " fill="url(#cyan-wave-grad)" />

                            <!-- Dalga Üst Parlak Çizgisi -->
                            <path d="
                                M 112 280
                                C 178 255, 268 227, 318 193
                            " stroke="url(#wave-crest-grad)" stroke-width="2.4" stroke-linecap="round" fill="none" />
                        </g>
                    </g>

                    <!-- 4. Dış Cam Kontur Çizgisi -->
                    <use href="#outer-tv-shape" stroke="url(#stroke-rim-grad)" stroke-width="2.2" fill="none" />

                    <!-- 5. Yüzeyden Süpüren Cam Işık Yansıması -->
                    <g clip-path="url(#clip-outer)">
                        <polygon class="glass-glint" points="95,0 165,0 105,340 35,340" fill="url(#glint-sweep-grad)" />
                    </g>

                    <!-- 6. Play İkonu Arkası İnce Şok Dalgası -->
                    <path class="play-ripple" d="
                        M 154 126
                        C 154 116, 164 111, 173 116
                        L 234 152
                        C 243 157, 243 171, 234 176
                        L 173 212
                        C 164 217, 154 212, 154 202
                        Z
                    " stroke="#7dd3fc" stroke-width="1.5" fill="none" />

                    <!-- 7. Merkezdeki 3D Yuvarlatılmış Oynat (Play) İkonu -->
                    <g class="play-icon-group" filter="url(#play-soft-glow)">
                        <path d="
                            M 154 126
                            C 154 116, 164 111, 173 116
                            L 234 152
                            C 243 157, 243 171, 234 176
                            L 173 212
                            C 164 217, 154 212, 154 202
                            Z
                        " fill="url(#play-tri-grad)" />

                        <!-- Sol-Üst İnce Beyaz Işık Kenarı -->
                        <path d="
                            M 155.5 201
                            L 155.5 127
                            C 155.5 118, 164.5 113.5, 172.5 118
                            L 232 153
                        " stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" fill="none" opacity="0.92" />
                    </g>
                </svg>
            </div>

            <!-- Marka Yazısı: globale.tv -->
            <h1 class="brand-title">
                <span class="letter" style="--i:0">g</span>
                <span class="letter" style="--i:1">l</span>
                <span class="letter" style="--i:2">o</span>
                <span class="letter" style="--i:3">b</span>
                <span class="letter" style="--i:4">a</span>
                <span class="letter" style="--i:5">l</span>
                <span class="letter" style="--i:6">e</span>
                <span class="letter letter-dot" style="--i:7">.</span>
                <span class="letter" style="--i:8">t</span>
                <span class="letter" style="--i:9">v</span>
            </h1>
        </div>
    </main>

    <script>
        (function () {
            let chimePlayed = false;
            let audioCtx = null;

            function playGentleBootChime() {
                if (chimePlayed) return;

                try {
                    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                    if (!AudioContextClass) return;

                    if (!audioCtx) {
                        audioCtx = new AudioContextClass();
                    }

                    if (audioCtx.state === 'suspended') {
                        audioCtx.resume().catch(() => {});
                    }

                    if (audioCtx.state !== 'running') {
                        return;
                    }

                    chimePlayed = true;
                    const now = audioCtx.currentTime;

                    // Yumuşak low-pass filtre (sıcak ve nazik Smart TV tonu)
                    const filter = audioCtx.createBiquadFilter();
                    filter.type = 'lowpass';
                    filter.frequency.setValueAtTime(1500, now);
                    filter.Q.setValueAtTime(0.6, now);

                    const master = audioCtx.createGain();
                    master.gain.setValueAtTime(0.22, now);

                    filter.connect(master);
                    master.connect(audioCtx.destination);

                    // 1) Çok hafif sıcak alt akor (C3 + G3)
                    [130.81, 196.00].forEach((freq, idx) => {
                        const osc = audioCtx.createOscillator();
                        const gain = audioCtx.createGain();
                        osc.type = 'sine';
                        osc.frequency.setValueAtTime(freq, now + 0.08);

                        gain.gain.setValueAtTime(0.0001, now + 0.08);
                        gain.gain.linearRampToValueAtTime(idx === 0 ? 0.14 : 0.08, now + 0.55);
                        gain.gain.exponentialRampToValueAtTime(0.0001, now + 2.6);

                        osc.connect(gain);
                        gain.connect(filter);
                        osc.start(now + 0.08);
                        osc.stop(now + 2.7);
                    });

                    // 2) 3 narin kristal açılış notası (G4 -> B4 -> D5)
                    const notes = [
                        { freq: 392.00, start: 0.42, duration: 1.6, volume: 0.13 },
                        { freq: 493.88, start: 0.64, duration: 1.75, volume: 0.12 },
                        { freq: 587.33, start: 0.88, duration: 2.05, volume: 0.13 }
                    ];

                    notes.forEach((n) => {
                        const osc = audioCtx.createOscillator();
                        const gain = audioCtx.createGain();

                        osc.type = 'sine';
                        osc.frequency.setValueAtTime(n.freq, now + n.start);

                        gain.gain.setValueAtTime(0.0001, now + n.start);
                        gain.gain.linearRampToValueAtTime(n.volume, now + n.start + 0.08);
                        gain.gain.exponentialRampToValueAtTime(0.0001, now + n.start + n.duration);

                        osc.connect(gain);
                        gain.connect(filter);

                        osc.start(now + n.start);
                        osc.stop(now + n.start + n.duration + 0.05);
                    });
                } catch (e) {
                    // Sessizce devam et
                }
            }

            // Uygulama açılır açılmaz sesi başlat
            window.addEventListener('DOMContentLoaded', playGentleBootChime);
            window.addEventListener('load', playGentleBootChime);

            // Tarayıcı otomatik ses politikası engellerse ilk dokunuşta veya kumanda tuşunda bir kez çal
            const unlockEvents = ['pointerdown', 'touchstart', 'keydown'];
            const onFirstInteraction = () => {
                playGentleBootChime();
                if (chimePlayed) {
                    unlockEvents.forEach((evt) => window.removeEventListener(evt, onFirstInteraction));
                }
            };
            unlockEvents.forEach((evt) => window.addEventListener(evt, onFirstInteraction, { passive: true }));
        })();
    </script>
</body>
</html>
