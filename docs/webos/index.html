<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Globale.tv — webOS Test</title>
<meta name="description" content="Globale.tv LG webOS Browser-Testversion">
<link rel="stylesheet" href="style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.17/hls.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="i18n.js"></script>
</head>
<body>

<div id="tv-wrap">
  <div id="tv-screen">

    <!-- Laden -->
    <div class="screen active" id="screen-loading">
      <div class="logo-mark">Globale<span>.tv</span></div>
      <div class="spinner"></div>
      <div class="muted" style="font-size:1.6vh" data-i18n="loading"></div>
    </div>

    <!-- Panel-Verbindung -->
    <div class="screen" id="screen-connect">
      <div class="connect-grid">
        <div class="connect-left">
          <div class="logo-mark" style="font-size:2.6vh">Globale<span>.tv</span></div>
          <div class="connect-title" data-i18n="connect_title"></div>
          <div class="kv">
            <div class="k" data-i18n="device_id"></div>
            <div class="v" id="connectDeviceId">—</div>
          </div>
          <div class="kv">
            <div class="k" data-i18n="pin"></div>
            <div class="v" id="connectPin">······</div>
          </div>
          <div class="pin-status" id="connectStatus" data-i18n="connecting"></div>
          <div class="panel-addr"><span data-i18n="panel_label"></span>: <span id="connectPanelAddr">is.gd/gtvpanel</span></div>
          <div class="row" style="gap:1vw; margin-top:1vh;">
            <button class="btn-ghost focusable" id="btnRotatePin" style="padding:1.1vh 1.8vw;" data-i18n="rotate_pin"></button>
            <button class="btn-ghost focusable" id="btnSkipDemo" style="padding:1.1vh 1.8vw; border-color:var(--warn); color:var(--warn);" data-i18n="skip_demo"></button>
          </div>
        </div>
        <div class="col" style="align-items:center; gap:1vh;">
          <div class="qr-box"><div id="qrCanvas"></div></div>
          <div class="muted" style="font-size:1.4vh" data-i18n="qr_hint"></div>
        </div>
      </div>
    </div>

    <!-- Ana ekran -->
    <div class="screen" id="screen-home">
      <div class="app-nav">
        <div class="nav-logo">▶</div>
        <button class="nav-ic" title="Suche">🔍</button>
        <button class="nav-ic active" title="Live TV">📺</button>
        <button class="nav-ic" title="Filmler">▦</button>
        <button class="nav-ic" title="Diziler">▭</button>
        <button class="nav-ic" title="Favoriten">♡</button>
        <button class="nav-ic" title="İndirilenler">⬇</button>
        <button class="nav-ic" title="Öne çıkanlar">★</button>
        <div class="grow"></div>
        <button class="nav-ic focusable" id="btnNavSettings" title="Ayarlar">⚙</button>
      </div>
      <div class="sidebar" id="sidebarGroups"></div>
      <div class="channel-list" id="channelList"></div>
      <div class="preview col" id="previewPane">
        <div class="pv-box" id="previewBox"><span data-i18n="preview_empty"></span></div>
        <div class="pv-title" id="previewTitle">—</div>
        <div class="pv-sub" id="previewSub" data-i18n="preview_select"></div>
        <div class="grow"></div>
        <button class="icon-btn focusable" id="btnOpenSettings" style="align-self:flex-end;">⚙</button>
      </div>
    </div>

    <!-- Boş durum -->
    <div class="screen" id="screen-empty">
      <div class="topbar">
        <button class="icon-btn focusable" id="btnEmptyBack">←</button>
        <div class="title">Globale.tv</div>
        <button class="icon-btn focusable" id="btnEmptySettings">⚙</button>
      </div>
      <div class="empty-state">
        <div class="logo-mark" style="font-size:3vh">Globale<span>.tv</span></div>
        <div style="font-size:2vh" data-i18n="empty_title"></div>
        <div class="muted" style="font-size:1.6vh; max-width:60%; text-align:center;" id="emptyBody"></div>
        <button class="btn-primary focusable" id="btnEmptyConnect" data-i18n="empty_btn"></button>
      </div>
    </div>

    <!-- Oynatıcı -->
    <div class="screen" id="screen-player">
      <video id="videoEl" playsinline></video>
      <div class="player-top" id="playerTop">Globale.tv</div>
      <div class="player-osd" id="playerOsd">
        <div class="p-name" id="playerName">—</div>
        <div class="p-meta" id="playerMeta">—</div>
      </div>
    </div>

    <!-- Ayarlar -->
    <div class="screen" id="screen-settings">
      <div class="settings-nav" id="settingsNav">
        <div class="s-item focusable" data-sec="general"><span class="ic">⚙</span><span data-i18n="settings_general"></span></div>
        <div class="s-item focusable" data-sec="display"><span class="ic">🖥</span><span data-i18n="settings_display"></span></div>
        <div class="s-item focusable" data-sec="audio"><span class="ic">🔊</span><span data-i18n="settings_audio"></span></div>
        <div class="s-item focusable" data-sec="player"><span class="ic">▶</span><span data-i18n="settings_player"></span></div>
        <div class="s-item focusable" data-sec="lang"><span class="ic">🌐</span><span data-i18n="settings_lang"></span></div>
        <div class="s-item focusable" data-sec="qr"><span class="ic">📱</span><span data-i18n="settings_qr"></span></div>
        <div class="s-item focusable" data-sec="sources"><span class="ic">🔗</span><span data-i18n="settings_sources"></span></div>
        <div class="s-item focusable" data-sec="backup"><span class="ic">💾</span><span data-i18n="settings_backup"></span></div>
        <div class="s-item focusable" data-sec="about"><span class="ic">ℹ</span><span data-i18n="settings_about"></span></div>
      </div>
      <div class="settings-body" id="settingsBody">
        <div class="topbar" style="padding:0 0 1vh 0; border:none;">
          <button class="icon-btn focusable" id="btnSettingsBack">←</button>
          <div class="title" id="settingsSectionTitle">—</div>
        </div>
        <div id="settingsContent"></div>
      </div>
    </div>

    <div class="tv-clock" id="tvClock">
      <div class="tc-time" id="tcTime">--:--</div>
      <div class="tc-date" id="tcDate">—</div>
    </div>

  </div>
</div>

<!-- Sanal kumanda (yalnızca test modu) -->
<button id="remote-toggle" aria-label="Fernbedienung ein/aus">🎮</button>
<div id="remote">
  <div class="r-top">
    <button class="r-pill" data-key="Back"><span data-i18n="remote_back"></span></button>
    <button class="r-pill" data-key="Home"><span data-i18n="remote_home"></span></button>
  </div>
  <div class="r-dpad">
    <button class="up" data-key="ArrowUp">▲</button>
    <button class="left" data-key="ArrowLeft">◀</button>
    <button class="ok" data-key="Enter">OK</button>
    <button class="right" data-key="ArrowRight">▶</button>
    <button class="down" data-key="ArrowDown">▼</button>
  </div>
  <div class="r-row">
    <button class="r-pill" data-key="ChanUp">CH+</button>
    <button class="r-pill" data-key="ChanDown">CH-</button>
  </div>
</div>
<button class="fullscreen-btn" id="btnFullscreen"><span data-i18n="fullscreen"></span></button>

<script src="app.js"></script>
</body>
</html>
