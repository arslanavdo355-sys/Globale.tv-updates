    else if (d[k]) { el.textContent = d[k]; }
  });
  document.documentElement.lang = l;
  document.documentElement.dir = (l === 'ar') ? 'rtl' : 'ltr';
  try { localStorage.setItem('globale_privacy_lang', l); } catch(e){}
}
