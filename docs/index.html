const RTL = {ar:1};
function applyLang(l){
  const d = I18N[l] || I18N.tr;
  document.querySelectorAll('[data-t]').forEach(el=>{
    const k = el.getAttribute('data-t');
    if(d[k] !== undefined) el.textContent = d[k];
  });
  document.documentElement.lang = l;
  document.documentElement.dir = RTL[l] ? 'rtl' : 'ltr';
  try{ localStorage.setItem('globaletv_lang', l); }catch(e){}
  const sel = document.getElementById('langsel');
  if(sel) sel.value = l;
}
function pickDefaultLang(){
  try{
    const saved = localStorage.getItem('globaletv_lang');
    if(saved && I18N[saved]) return saved;
  }catch(e){}
  const nav = (navigator.language||'tr').slice(0,2).toLowerCase();
  return I18N[nav] ? nav : 'tr';
}
applyLang(pickDefaultLang());
document.getElementById('langsel').addEventListener('change', e=>applyLang(e.target.value));

    if(!j) return;
    const pill=document.getElementById('relPill');
    if(pill && j.tag_name) pill.textContent=j.tag_name;
  }).catch(()=>{});
</script>
