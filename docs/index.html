<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">

<title>Globale.tv – İndir</title>
<style>
  :root{--bg:#0b1220;--card:#111a2e;--accent:#22c1dc;--text:#f4f7fb;--muted:#9fb0c9}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(1200px 600px at 50% -10%, #1b2a4a, var(--bg));font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--text);padding:24px}

  p{color:var(--muted);margin:0 0 24px;line-height:1.5}
  .btn{display:block;width:100%;padding:16px;border-radius:14px;background:var(--accent);color:#06222a;font-weight:700;font-size:17px;text-decoration:none;margin-bottom:12px}
  .btn.secondary{background:transparent;border:1px solid #2a3b5c;color:var(--text);font-weight:600}
  .note{font-size:13px;color:var(--muted);margin-top:20px}
  a{transition:transform .15s}
  a:active{transform:scale(.98)}
</style>
</head>
<body>
  <div class="card">
    <img class="logo" src="https://raw.githubusercontent.com/arslanavdo355-sys/Globale.tv-updates/main/assets/logo.jpg" alt="Globale.tv">

    <div class="note">Intel/x86 işlemcili kutular için ayrı sürüm GitHub sayfasındadır.</div>
  </div>
</body>
</html>
